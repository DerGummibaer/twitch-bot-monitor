<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream Credits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  /* Everything is sized in --u, which follows the browser source's own size:
     on 16:9 it equals 1% of the height; on a narrow source it shrinks with the width. */
  :root {
    --k: 1;              /* text size from the editor */
    --u: calc(min(1vh, 0.5625vw) * var(--k));
    --font: 'Cormorant Garamond';
    --ink: #f2ede3;      /* warm film white */
    --dim: #d2cbbd;      /* role labels (bright enough over gameplay) */
    --faint: #aaa395;    /* small details */
    --shadow: 0 0 calc(var(--u) * .5) rgba(0,0,0,.9), 0 calc(var(--u) * .15) calc(var(--u) * .35) rgba(0,0,0,.95), 0 0 calc(var(--u) * 1.6) rgba(0,0,0,.65);
    --bg: transparent;
  }
  /* Solid black background (from the editor, or ?bg=black on the link) */
  body.solid { --bg: #000; }
  body.noshadow { --shadow: none; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: transparent; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font), 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    text-shadow: var(--shadow);
    -webkit-font-smoothing: antialiased;
  }

  #roll { position: absolute; left: 0; right: 0; top: 0; will-change: transform; padding: 0 calc(var(--u) * 6); }
  #sampleTag { position: fixed; top: 10px; left: 10px; z-index: 2; background: #f59e0b; color: #000; text-shadow: none;
    font: 600 13px/1.3 system-ui, sans-serif; padding: 4px 10px; border-radius: 4px; }
  #sampleTag[hidden] { display: none; }
  #probe { position: absolute; visibility: hidden; height: calc(var(--u) * 100); width: 1px; }

  /* Opening title card */
  .title-card { text-align: center; padding: calc(var(--u) * 8) 0 calc(var(--u) * 14); }
  .title-card .channel {
    font-size: calc(var(--u) * 11); font-weight: 500; line-height: 1; letter-spacing: .04em;
    overflow-wrap: anywhere;
  }
  .title-card .stream-title {
    font-style: italic; font-size: calc(var(--u) * 3.4); opacity: .9;
    margin: calc(var(--u) * 3.2) auto 0; max-width: 90%; line-height: 1.3;
  }
  .title-card .meta { font-size: calc(var(--u) * 2.4); color: var(--dim); margin-top: calc(var(--u) * 1.6); }

  /* Classic two-column credit: role right-aligned | name left-aligned */
  .credit {
    display: grid; grid-template-columns: 1fr 1fr; column-gap: calc(var(--u) * 2.2);
    margin-bottom: calc(var(--u) * 7); align-items: start;
  }
  .role {
    text-align: right; font-style: italic; color: var(--dim);
    font-size: calc(var(--u) * 2.9); line-height: 1.5; padding-top: calc(var(--u) * .5);
  }
  .names { text-align: left; font-size: calc(var(--u) * 3.6); font-weight: 500; line-height: 1.5; min-width: 0; overflow-wrap: anywhere; }
  .names .detail { color: var(--dim); opacity: .8; font-weight: 400; font-style: italic; font-size: .72em; margin-left: .5em; }
  .names.cols { column-count: 2; column-gap: calc(var(--u) * 4); }
  .names.cols div { break-inside: avoid; }

  /* Special mentions get a centred card of their own */
  .honour { text-align: center; margin-bottom: calc(var(--u) * 9); }
  .honour .role { text-align: center; padding: 0; font-size: calc(var(--u) * 3); }
  .honour .who { font-size: calc(var(--u) * 6.4); font-weight: 500; line-height: 1.15; margin-top: calc(var(--u) * .6); overflow-wrap: anywhere; }
  .honour .what { font-size: calc(var(--u) * 2.6); color: var(--dim); margin-top: calc(var(--u) * .6); }

  .divider { width: calc(var(--u) * 6); height: 1px; background: var(--dim); opacity: .6; margin: calc(var(--u) * 4) auto calc(var(--u) * 10); }

  .closing { text-align: center; padding: calc(var(--u) * 10) 0 0; }
  .closing .thanks { font-size: calc(var(--u) * 6); font-style: italic; }
  .closing .small { font-size: calc(var(--u) * 2.4); color: var(--dim); margin-top: calc(var(--u) * 2); }

  .empty { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 calc(var(--u) * 6); }
  .empty .channel { font-size: calc(var(--u) * 8); font-weight: 500; overflow-wrap: anywhere; }
  .empty .small { font-size: calc(var(--u) * 2.6); color: var(--dim); margin-top: calc(var(--u) * 2); font-style: italic; }

  /* Short, wide sources (a banner): let the text use more of the height */
  @media (min-aspect-ratio: 5/2) {
    :root { --u: calc(min(1.9vh, 0.5625vw) * var(--k)); }
  }

  /* Tall, narrow sources (a side column): stack each role above its names, everything centred */
  @media (max-aspect-ratio: 1/1) {
    :root { --u: calc(min(0.8vh, 1.15vw) * var(--k)); }
    .credit { grid-template-columns: 1fr; text-align: center; row-gap: calc(var(--u) * .8); }
    .role, .names { text-align: center; }
    .names.cols { column-count: 1; }
  }
</style>
</head>
<body>
<div id="roll"></div>
<div id="probe"></div>
<div id="sampleTag" hidden>Sample data — remove ?sample=1 from the link before going live</div>

<script>
(function () {
  var params   = new URLSearchParams(location.search);
  var urlSpeed = Number(params.get('speed')) || 0;   // ?speed= on the link overrides the editor
  var urlBg    = params.get('bg');                    // ?bg=black or ?bg=transparent overrides the editor
  var LOOP     = params.get('loop') !== '0';

  var SAMPLE   = params.get('sample') === '1';
  var dataUrl  = location.pathname.replace(/\/+$/, '') + '/data' + (SAMPLE ? '?sample=1' : '');
  var roll     = document.getElementById('roll');
  var anim     = null;
  var lastData = null;
  var preview  = null;      // unsaved settings sent by the dashboard editor
  var loadedFonts = {};
  var timer    = null;

  var DEFAULTS = {
    font: 'Cormorant Garamond', textColor: '#f2ede3', labelColor: '#d2cbbd', size: 100, speed: 70,
    background: 'transparent', shadow: true, closingText: 'Thanks for watching',
    show: { honours: true, raids: true, gifts: true, bits: true, subs: true, followers: true, chatStats: true }
  };

  function merged(s) {
    var o = {}, k;
    s = s || {};
    for (k in DEFAULTS) o[k] = (s[k] === undefined || s[k] === null) ? DEFAULTS[k] : s[k];
    o.show = {};
    for (k in DEFAULTS.show) o.show[k] = s.show && typeof s.show[k] === 'boolean' ? s.show[k] : DEFAULTS.show[k];
    return o;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function num(n) { return Number(n || 0).toLocaleString('en-GB'); }
  function plural(n, one, many) { return num(n) + ' ' + (Number(n) === 1 ? one : many); }
  function duration(sec) {
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    if (h && m) return h + 'h ' + m + 'm';
    if (h) return h + 'h';
    return m + 'm';
  }

  // Load a Google Font by name. If it isn't on Google Fonts, the browser falls back to
  // a font with that name installed on this computer.
  function loadFont(name) {
    if (!name || loadedFonts[name] || name === 'Cormorant Garamond') return Promise.resolve();
    loadedFonts[name] = true;
    var fam = encodeURIComponent(name).replace(/%20/g, '+');
    return new Promise(function (resolve) {
      var done = false;
      function finish() { if (!done) { done = true; resolve(); } }
      function add(href, onfail) {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = href;
        l.onload = function () {
          var w = document.fonts && document.fonts.load
            ? Promise.all([document.fonts.load('500 40px "' + name + '"'), document.fonts.load('italic 400 40px "' + name + '"')])
            : Promise.resolve();
          w.then(finish, finish);
        };
        l.onerror = onfail;
        document.head.appendChild(l);
      }
      // Ask for regular, medium and italic; if the font doesn't have those, ask for just the regular style
      add('https://fonts.googleapis.com/css2?family=' + fam + ':ital,wght@0,400;0,500;1,400;1,500&display=swap', function () {
        add('https://fonts.googleapis.com/css2?family=' + fam + '&display=swap', finish);
      });
      setTimeout(finish, 3000);
    });
  }

  function applyLook(s) {
    var root = document.documentElement.style;
    root.setProperty('--font', '"' + s.font + '"');
    root.setProperty('--ink', s.textColor);
    root.setProperty('--dim', s.labelColor);
    root.setProperty('--k', String(s.size / 100));
    var bg = urlBg || s.background;
    document.body.classList.toggle('solid', bg === 'black' || bg === 'solid');
    document.body.classList.toggle('noshadow', !s.shadow);
  }

  function credit(role, rows, manyColumns) {
    if (!rows.length) return '';
    var cls = 'names' + (manyColumns && rows.length > 12 ? ' cols' : '');
    return '<section class="credit"><div class="role">' + esc(role) + '</div><div class="' + cls + '">' +
      rows.map(function (r) { return '<div>' + r + '</div>'; }).join('') + '</div></section>';
  }
  function honour(role, who, what) {
    return '<section class="honour"><div class="role">' + esc(role) + '</div>' +
      '<div class="who">' + esc(who) + '</div><div class="what">' + esc(what) + '</div></section>';
  }

  function render(d, s) {
    if (d.empty) {
      roll.innerHTML = '<div class="empty"><div class="channel">' + esc(d.channel) + '</div>' +
        '<div class="small">The credits will fill in once the stream goes live.</div></div>';
      return false;
    }
    var show = s.show;
    var date = new Date(d.startedAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    var meta = [d.game, date, duration(d.durationSec)].filter(Boolean).map(esc).join(' &nbsp;·&nbsp; ');

    var html = '<header class="title-card">' +
      '<div class="channel">' + esc(d.channel) + '</div>' +
      (d.title ? '<div class="stream-title">' + esc(d.title) + '</div>' : '') +
      '<div class="meta">' + meta + '</div></header>';

    if (show.honours) {
      var honours = '';
      if (d.longest)   honours += honour('Longest in chat', d.longest.name, 'in chat for ' + duration(d.longest.seconds));
      if (d.chattiest) honours += honour('Most messages', d.chattiest.name, plural(d.chattiest.messages, 'message', 'messages'));
      if (d.gifters.length)  honours += honour('Most generous gifter', d.gifters[0].name, plural(d.gifters[0].total, 'gifted sub', 'gifted subs'));
      if (d.cheerers.length) honours += honour('Biggest cheer', d.cheerers[0].name, plural(d.cheerers[0].total, 'bit', 'bits'));
      if (honours) html += honours + '<div class="divider"></div>';
    }
    if (show.raids) html += credit('Raided by', d.raids.map(function (r) {
      return esc(r.name) + '<span class="detail">with ' + plural(r.viewers, 'viewer', 'viewers') + '</span>';
    }));
    if (show.gifts) html += credit('Gifted subs', d.gifters.map(function (g) {
      return esc(g.name) + '<span class="detail">× ' + num(g.total) + '</span>';
    }));
    if (show.bits) html += credit('Cheered', d.cheerers.map(function (c) {
      return esc(c.name) + '<span class="detail">' + plural(c.total, 'bit', 'bits') + '</span>';
    }));
    if (show.subs) html += credit(d.subs.length === 1 ? 'Subscriber' : 'Subscribers', d.subs.map(function (x) {
      var det = x.plan === 'Prime' ? 'Prime' : (x.months > 1 ? x.months + ' months' : 'new');
      return esc(x.name) + '<span class="detail">' + det + '</span>';
    }), true);
    if (show.followers) html += credit(d.followers.length === 1 ? 'New follower' : 'New followers', d.followers.map(esc), true);

    var closing = '';
    if (s.closingText) closing += '<div class="thanks">' + esc(s.closingText) + '</div>';
    if (show.chatStats) closing += '<div class="small">' + plural(d.totals.messages, 'message', 'messages') + ' from ' +
      plural(d.totals.chatters, 'person', 'people') + ' in chat</div>';
    if (closing) html += '<footer class="closing">' + closing + '</footer>';

    roll.innerHTML = html;
    document.getElementById('sampleTag').hidden = !d.sample;
    return true;
  }

  function play(s) {
    var vh = window.innerHeight;
    var h  = roll.offsetHeight;
    // Scroll speed follows the text size, so a smaller source scrolls proportionally slower
    var unit = document.getElementById('probe').offsetHeight / 100 || vh / 100;
    var pxPerSec = Math.max(10, urlSpeed || s.speed) * (unit / 10.8);
    var start = Math.round(vh * 0.45);   // title appears straight away instead of after a black screen
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (anim) anim.cancel();
    anim = roll.animate(
      [{ transform: 'translateY(' + start + 'px)' }, { transform: 'translateY(' + (-h) + 'px)' }],
      { duration: reduce ? 1 : ((start + h) / pxPerSec) * 1000, easing: 'linear', fill: 'forwards' }
    );
    anim.onfinish = function () { if (LOOP) schedule(2500); };
  }

  function show(d) {
    var s = merged(preview || d.settings);
    applyLook(s);
    return loadFont(s.font).then(function () {
      if (render(d, s)) play(s);
      else schedule(60000);
    });
  }

  function schedule(ms) { clearTimeout(timer); timer = setTimeout(cycle, ms); }

  function cycle() {
    fetch(dataUrl, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { lastData = d; return show(d); })
      .catch(function () { schedule(10000); });
  }

  // The dashboard editor sends unsaved changes here so the preview updates as you edit
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'credits-preview') return;
    preview = e.data.settings || null;
    clearTimeout(timer);
    if (lastData) show(lastData); else cycle();
  });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(cycle); else cycle();
})();
</script>
</body>
</html>
